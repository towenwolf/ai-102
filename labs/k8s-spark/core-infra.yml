# core-infra.yml
# Naming convention: <org>-<env>-<region>-<workload>-<resourceType>
# Note: Sensitive values (subscription_id, tenant_id) are loaded from ../.env file
azure:
  subscription_id: "${AZURE_SUBSCRIPTION_ID}"
  tenant_id: "${AZURE_TENANT_ID}"
  location: "westus2"
  # Base naming components - used to construct resource names
  naming:
    org: "trwolf"
    env: "dev"
    region: "wus2"
    workload: "analytics"
  # Derived: ${org}-${env}-${region}-${workload}
  resource_group: "trwolf-dev-wus2-analytics-rg"
  tags:
    env: "dev"
    workload: "analytics"
    owner: "data-platform"

aks:
  name: "trwolf-dev-wus2-analytics-aks"
  kubernetes_version: "1.29"
  private_cluster: false
  rbac_enabled: true
  workload_identity_enabled: true
  oidc_issuer_enabled: true

  # Networking: use AKS-managed kubenet for MVP simplicity
  # Custom VNet can be added later for production/private scenarios
  networking:
    network_plugin: "kubenet"  # simpler than azure CNI for MVP

  node_pools:
    system:
      name: "system"
      vm_size: "Standard_DS2_v2"
      node_count: 1
      max_pods_per_node: 30
      mode: "System"
    spark:
      name: "spark"
      vm_size: "Standard_D8s_v5"
      min_count: 1
      max_count: 4
      enable_autoscaling: true
      max_pods_per_node: 30
      mode: "User"
      labels:
        workload: "spark"
      taints:
        - key: "workload"
          value: "spark"
          effect: "NoSchedule"

# ACR naming: no hyphens allowed, max 50 chars
acr:
  name: "trwolfdevwus2acr"
  sku: "Basic"
  private_endpoint: false

# Storage naming: lowercase alphanumeric, max 24 chars
# Convention: stcd<workload><###>
storage:
  account_name: "stcdanalytics001"
  kind: "StorageV2"
  redundancy: "LRS"
  hierarchical_namespace: true
  containers:
    - raw
    - curated
    - logs

identity:
  managed_identity_name: "trwolf-dev-wus2-spark-mi"
  kubernetes_namespace: "data-spark"
  service_account_name: "spark-sa"
  role_assignments:
    - role: "Storage Blob Data Contributor"
      scope: "storage_account"

observability:
  container_insights_enabled: true
  log_analytics_workspace: "trwolf-dev-wus2-analytics-law"
